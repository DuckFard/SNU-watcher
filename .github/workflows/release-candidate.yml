name: Unsigned Windows preview candidate

on:
  workflow_dispatch:

# This workflow builds reviewable assets; it never tags or publishes a release.
permissions:
  contents: read

jobs:
  prepare-candidate:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Offline packaging regressions
        shell: pwsh
        run: |
          ./tests/scripts/Test-NativeBuildOutput.ps1
          ./tests/scripts/Test-ReleaseAssets.ps1
      - name: Installed notification launcher guards without native execution
        shell: powershell
        run: ./tests/scripts/Test-InstalledNativeDelivery.ps1
      - name: Locked foundation tests and coverage
        shell: pwsh
        run: ./scripts/Test-Foundation.ps1
      - name: Prepare versioned unsigned installer and public metadata
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe' }
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup 6 is required.' }
          ./tests/scripts/Test-InstallerRecovery.ps1 -IsccPath $compiler
          $output = @(& ./scripts/Build-Native.ps1 -IsccPath $compiler)
          $output | ForEach-Object { Write-Output $_ }
          $roots = @($output | Where-Object { $_ -is [string] -and $_.StartsWith('Build output root: ') })
          if ($roots.Count -ne 1) { throw 'Cannot identify the isolated native build.' }
          ./scripts/New-ReleaseAssets.ps1 -BuildRoot $roots[0].Substring('Build output root: '.Length)
      - name: Preserve unsigned candidate assets for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-preview-candidate
          path: artifacts/native/*/release/*
          if-no-files-found: error
          retention-days: 14

# Native and live-source acceptance must qualify these exact bytes separately.
# Descriptive provenance is not an Authenticode signature or build attestation.
