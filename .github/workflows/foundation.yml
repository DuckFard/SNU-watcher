name: Windows foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Native packaging output isolation regression
        shell: pwsh
        run: ./tests/scripts/Test-NativeBuildOutput.ps1
      - name: Installer recovery policy and native process probe
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe' }
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'The Windows runner needs the Inno Setup 6 compiler.' }
          Write-Output ('Inno Setup compiler: ' + (Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion)
          ./tests/scripts/Test-InstallerRecovery.ps1 -IsccPath $compiler
      - name: Locked restore, build, offline tests and coverage
        shell: pwsh
        run: ./scripts/Test-Foundation.ps1
      - name: Publish app-local Windows candidate
        shell: pwsh
        run: |
          dotnet publish src/SnuWatcher.Desktop/SnuWatcher.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          $auditJson = dotnet list SnuWatcher.slnx package --vulnerable --include-transitive --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
          $audit = $auditJson | ConvertFrom-Json
          if ($audit.version -ne 1 -or @($audit.projects).Count -ne 5) { throw 'Unexpected audit result; review its schema.' }
          $vulnerable = @($audit.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_ -and @($_.vulnerabilities).Count -gt 0 })
          if ($vulnerable.Count -gt 0) { throw 'Known vulnerable dependencies found; review the audit before merging.' }
      - name: Preserve test evidence and unsigned app candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-foundation-evidence
          path: |
            artifacts/test-results
            artifacts/installer-recovery-tests
            artifacts/publish
          retention-days: 14

# CI is offline with respect to SNU and does not send notifications.
# An uploaded developer candidate is not a signed release or clean-VM validation.
